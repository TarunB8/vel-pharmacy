<!DOCTYPE html>
<html>
<head>
<title>VEL HEALTH | Customer Dashboard</title>
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<style>
body{margin:0;font-family:Segoe UI;background:#f7faf9}
.header{
  padding:20px 8%;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.logo{font-weight:700;color:#16a085}

.hero{
  margin:0 8%;
  background:linear-gradient(135deg,#16a085,#0f766e);
  border-radius:18px;
  padding:40px;
  color:#fff;
}
.hero small{opacity:.9}

.credit-box{
  margin-top:25px;
  background:rgba(255,255,255,.15);
  padding:20px;
  border-radius:14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
  margin:30px 8%;
}
.card{
  background:#fff;
  padding:20px;
  border-radius:14px;
  box-shadow:0 8px 20px rgba(0,0,0,.05);
  text-align:center;
}
.card h2{margin:10px 0}

.section{
  margin:20px 8%;
  background:#fff;
  padding:20px;
  border-radius:14px;
  box-shadow:0 8px 20px rgba(0,0,0,.05);
}
.row{
  display:flex;
  justify-content:space-between;
  padding:12px 0;
  border-bottom:1px solid #eee;
}
.row:last-child{border:none}
</style>
</head>

<body>

<div class="header">
  <div class="logo">💚 VEL HEALTH</div>
  <a href="/logout">⎋</a>
</div>

<div class="hero">
  <h2 id="name">Hello!</h2>
  <small>Your health companion is here</small>

  <div class="credit-box">
    <div>
      <h1 id="credits">₹0</h1>
      <small>Available Credits</small>
    </div>
    <small style="cursor:pointer;text-decoration:underline"
      onclick="location.href='/credits-history.html'">
  View History →
</small>

  </div>
</div>

<div class="cards">
  <div class="card">
    <small>Total Spent</small>
    <h2 id="spent">₹0</h2>
  </div>
  <div class="card">
    <small>Credits Used</small>
    <h2 id="used">₹0</h2>
  </div>
  <div class="card">
    <small>Money Saved</small>
    <h2 id="saved">₹0</h2>
  </div>
</div>

<div class="section">
  <h3>Recent Purchases</h3>
  <div id="purchases"></div>
</div>

<script>
fetch("/customer/dashboard")
.then(r=>r.json())
.then(d=>{
  name.innerText = "Hello, " + d.name + " 👋";
  credits.innerText = "₹" + d.credits;
  spent.innerText = "₹" + d.totalSpent;
  used.innerText = "₹" + d.creditsUsed;
  saved.innerText = "₹" + d.saved;

  purchases.innerHTML = d.purchases.length
    ? d.purchases.map(p=>`
      <div class="row">
        <div>${p.items} items<br><small>${new Date(p.created_at).toLocaleDateString()}</small></div>
        <b>₹${p.amount}</b>
      </div>`).join("")
    : "<p>No purchases yet</p>";
});
</script>

</body>
</html>
